name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Project gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run check:maps
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - id: e2e
        run: npm run test:e2e -- --reporter=line,html
        env:
          PLAYWRIGHT_HTML_OPEN: never
      - name: Check the dev map prototype and capture both cell sizes
        id: map-prototype
        if: github.event_name == 'pull_request'
        run: npm run test:prototype
      - name: Upload map prototype screenshots
        if: ${{ github.event_name == 'pull_request' && steps.map-prototype.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: map-prototype-screenshots
          path: test-results/prototype/**/map-prototype-cell-*.png
          if-no-files-found: error
      - name: Upload world map overviews
        if: ${{ github.event_name == 'pull_request' && steps.map-prototype.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: world-map-overviews
          path: test-results/prototype/**/world-map-*.png
          if-no-files-found: error
      - name: Upload desktop and mobile world interaction screenshots
        if: ${{ github.event_name == 'pull_request' && steps.e2e.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: world-interaction-screenshots
          path: test-results/**/world-interaction-*.png
          if-no-files-found: error
      - name: Upload Playwright report
        if: ${{ failure() && steps.e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: error

  changes:
    name: Detect dependency changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      dependencies: ${{ steps.scan.outputs.dependencies }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scan
        name: Compare package manifests with the PR merge base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- package.json package-lock.json)
          if [[ -n "$changed" ]]; then
            echo 'dependencies=true' >> "$GITHUB_OUTPUT"
          else
            echo 'dependencies=false' >> "$GITHUB_OUTPUT"
          fi

  dependency-age:
    name: Dependency publish age
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.dependencies == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm run check:deps
